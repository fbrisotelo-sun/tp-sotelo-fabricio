<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador Rick and Morty</title>
  <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
  <header>
    <h1>Explorador de Rick and Morty</h1>
    <div class="buscador">
      <input type="text" id="input-busqueda" placeholder="Buscar personaje por nombre...">
      <select id="filtro-estado">
        <option value="">Todos los estados</option>
        <option value="alive">Alive</option>
        <option value="dead">Dead</option>
        <option value="unknown">Unknown</option>
      </select>
      <button id="btn-buscar">Buscar</button>
    </div>
  </header>

  <main>
    <p id="estado" class="estado"></p>
    <section id="contenedor-personajes" class="grid"></section>
  </main>

  <footer>
    <p>Trabajo Práctico · Fabricio Sotelo · Versión <span id="version">1.0</span></p>
  </footer>

  <script src="./js/app.js"></script>
</body>
</html>
