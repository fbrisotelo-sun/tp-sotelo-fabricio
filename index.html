<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explorador de Ubicaciones · Rick and Morty</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header class="encabezado">
    <h1>Explorador de Ubicaciones — Rick and Morty</h1>
    <p class="subtitulo">Consulta ubicaciones por nombre y filtra por tipo usando la API pública de Rick and Morty.</p>

    <form id="formulario-filtros" class="filtros" autocomplete="off">
      <input
        type="text"
        id="input-nombre"
        placeholder="Buscar ubicación por nombre..."
        aria-label="Buscar ubicación por nombre"
      />
      <input
        type="text"
        id="input-tipo"
        placeholder="Filtrar por tipo (ej. Planet)..."
        aria-label="Filtrar por tipo"
      />
      <button type="submit" id="btn-buscar">Buscar</button>
      <button type="button" id="btn-limpiar">Limpiar</button>
    </form>
  </header>

  <main class="contenedor">
    <p id="estado-busqueda" class="estado-busqueda" aria-live="polite"></p>
    <section id="resultados" class="grid-ubicaciones" aria-live="polite"></section>
  </main>

  <footer class="pie">
    <p>Explorador de Ubicaciones · Rick and Morty · <strong>Versión 1.1</strong> · Fabricio Sotelo</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
